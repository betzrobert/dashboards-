<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billable Staffing Dashboard — Week of Aug 17–21, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1C2A5E; --navy-2:#28407F; --navy-dk:#141F45;
    --gold:#C89116; --gold-br:#DCA426; --green:#2E9E5B; --red:#C4402E; --teal:#2A8F9E;
    --kpi-bg:#EFF2F8; --stripe:#F7F9FC; --track:#E7EBF3;
    --txt:#333F4E; --muted:#6B7480; --faint:#A3AAB6; --line:#E3E7EF;
    --canvas:#F1F4F8; --white:#fff;
    --font:"Lato","Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(20,31,69,.05),0 8px 24px rgba(20,31,69,.07);
    --radius:9px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto;padding:0 24px}

  /* ---------- header ---------- */
  header{background:var(--navy);background-image:linear-gradient(112deg,var(--navy-dk),var(--navy) 55%,var(--navy-2));color:#fff;border-bottom:4px solid var(--gold-br)}
  .htop{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 0 16px}
  .eyebrow{font-size:10px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold-br);margin-bottom:5px}
  h1{margin:0;font-size:27px;font-weight:900;letter-spacing:-.2px;line-height:1.1}
  .hmeta{font-size:12px;color:#BACADB;text-align:right;line-height:1.7}
  .hmeta b{display:block;color:#fff;font-weight:700;font-size:13px}
  nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
  nav button{
    appearance:none;border:0;background:transparent;color:#B9CADC;cursor:pointer;
    font-family:var(--font);font-size:12.5px;font-weight:700;letter-spacing:.2px;
    padding:11px 15px;border-bottom:3px solid transparent;white-space:nowrap;transition:.15s;
  }
  nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
  nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--gold-br)}
  nav button:focus-visible{outline:2px solid var(--gold-br);outline-offset:-3px}

  /* ---------- views ---------- */
  .view{display:none;padding:24px 0 56px}
  .view.on{display:block}
  .vhead{margin-bottom:18px}
  .vhead h2{margin:0 0 4px;font-size:21px;font-weight:900;color:var(--navy)}
  .vhead p{margin:0;font-size:13px;color:var(--muted)}

  /* ---------- kpis ---------- */
  .kpis{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
  .kpi{flex:1 1 170px;background:var(--white);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
  .kpi.c2{border-left-color:var(--green)} .kpi.c3{border-left-color:var(--red)}
  .kpi.c4{border-left-color:var(--teal)} .kpi.c5{border-left-color:var(--gold-br)}
  .kpi .n{font-size:27px;font-weight:900;color:var(--navy);line-height:1.05}
  .kpi .n small{font-size:14px;font-weight:700;color:var(--muted)}
  .kpi .sub{font-size:10.5px;color:var(--muted);margin-top:3px}
  .kpi .l{font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#5B6472;margin-top:6px}

  /* ---------- panels ---------- */
  .cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
  .col{flex:1 1 380px;min-width:0}
  .col.wide{flex:1.25 1 460px}
  .panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px 18px;margin-bottom:18px}
  .ptitle{margin:0 0 3px;font-size:14px;font-weight:900;color:var(--navy);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ptitle .tools{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:400}
  .psub{margin:0 0 12px;font-size:11.5px;color:var(--muted)}
  .pnote{margin:12px 0 0;font-size:11.5px;color:var(--muted);line-height:1.55}

  /* ---------- controls ---------- */
  .btn{font-family:var(--font);font-size:11.5px;font-weight:700;color:var(--navy);background:var(--white);border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer}
  .btn:hover{border-color:var(--teal);color:var(--teal)}
  .btn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  input[type="search"]{font-family:var(--font);font-size:11.5px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;width:130px;color:var(--txt)}
  input[type="search"]:focus{outline:none;border-color:var(--teal)}

  /* ---------- tables ---------- */
  table{width:100%;border-collapse:collapse}
  thead th{background:var(--navy);color:#fff;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:8px 10px;text-align:right;white-space:nowrap}
  thead th:first-child{text-align:left;border-radius:4px 0 0 0}
  thead th:last-child{border-radius:0 4px 0 0}
  thead th.l{text-align:left}
  thead th.s{cursor:pointer;user-select:none}
  thead th.s:hover{background:var(--navy-2)}
  thead th .ar{opacity:.4;font-size:9px;margin-left:3px}
  thead th.sorted .ar{opacity:1;color:var(--gold-br)}
  tbody td{padding:6.5px 10px;font-size:12.5px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  tbody td:first-child,tbody td.l{text-align:left}
  tbody tr:nth-child(even) td{background:var(--stripe)}
  tbody tr:hover td{background:#EAF3F5}
  tbody td.note{color:var(--muted);font-size:11.5px;text-align:left}
  tbody tr.tot td{font-weight:900;color:var(--navy);background:var(--kpi-bg);border-top:2px solid var(--navy);border-bottom:0}
  tbody tr.sub td{font-weight:700;color:var(--navy);background:#F4F6FA}
  .up{color:var(--green);font-weight:700} .dn{color:var(--red);font-weight:700} .flat{color:var(--muted)}
  .tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:999px}
  .tag.ok{background:#E4F3EA;color:#1E7A44} .tag.warn{background:#FCF0DC;color:#96690C}

  /* ---------- bars ---------- */
  .bars{display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:11px;padding:5.5px 0}
  .bar .bl{flex:0 0 var(--lw,140px);font-size:12px;font-weight:700;color:var(--navy);line-height:1.25}
  .bar .bl em{display:block;font-style:normal;font-weight:400;font-size:10.5px;color:var(--muted)}
  .bar .bt{flex:1 1 auto;background:var(--track);border-radius:999px;height:14px;overflow:hidden;min-width:40px}
  .bar .bf{display:block;height:100%;border-radius:999px;width:0;transition:width .75s cubic-bezier(.2,.7,.2,1)}
  .bar .bt.stack{display:flex}
  .bar .bt.stack .bf{border-radius:0;flex:0 0 auto}
  .bar .bt.stack .bf:first-child{border-radius:999px 0 0 999px}
  .bar .bt.stack .bf:last-child{border-radius:0 999px 999px 0}
  .bar .bv{flex:0 0 46px;text-align:right;font-size:12px;font-weight:900;color:var(--navy)}

  /* ---------- takeaway ---------- */
  .takeaway{background:var(--kpi-bg);border-radius:var(--radius);border-left:5px solid var(--gold-br);padding:15px 18px;font-size:13px;line-height:1.65}
  .takeaway b{color:var(--navy)}
  .src{font-size:10.5px;color:var(--faint);margin:12px 0 0;line-height:1.55}

  @media (max-width:760px){
    h1{font-size:21px} .hmeta{text-align:left}
    .kpi{flex:1 1 45%} .bar .bl{flex-basis:110px;font-size:11px}
    .view{padding-top:18px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{
    body{background:#fff} nav,.tools{display:none}
    .view{display:block!important;page-break-after:always;padding:12px 0}
    .panel,.kpi{box-shadow:none}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="htop">
      <div>
        <div class="eyebrow">Weekly Billable Staffing Status</div>
        <h1>Patient Solutions, Pharmacy &amp; Talent Acquisition</h1>
      </div>
      <div class="hmeta">
        <b>August 24, 2026</b>
        Prepared for the Chief People Officer
      </div>
    </div>
    <nav id="nav" role="tablist"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<script>
(function(){
  "use strict";

  var C={navy:'var(--navy)',green:'var(--green)',red:'var(--red)',teal:'var(--teal)',gold:'var(--gold-br)',muted:'var(--faint)'};
  var SRC_MAIN='Sources: Weekly Billable Staffing Status Report (Aug 10\u201314, 2026) \u2014 Pipeline Report Data; TA Pipeline Coverage Update and Patient Solutions &amp; Pharmacy Staffing Funnel (Week of 8/3\u20138/7, 2026).';

  /* ------------------------------------------------ helpers */
  function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

  function kpis(items){
    var w=el('div','kpis');
    items.forEach(function(it,i){
      var k=el('div','kpi c'+((i%5)+1));
      k.innerHTML='<div class="n">'+it[0]+'</div><div class="l">'+it[1]+'</div>'+
                  (it[2]?'<div class="sub">'+it[2]+'</div>':'');
      w.appendChild(k);
    });
    return w;
  }

  function panel(title,sub,tools){
    var p=el('div','panel');
    var h=el('h3','ptitle',title);
    if(tools)h.appendChild(tools);
    p.appendChild(h);
    if(sub)p.appendChild(el('p','psub',sub));
    return p;
  }

  /* table: cols [{h,align,cls,sortable}], rows [{cells:[],cls}] */
  function table(cols,rows,opts){
    opts=opts||{};
    var t=el('table'),thead=el('thead'),tr=el('tr');
    cols.forEach(function(c,i){
      var th=el('th',(c.align==='l'?'l ':'')+(opts.sort?'s':''),c.h+(opts.sort?'<span class="ar">\u25be</span>':''));
      if(opts.sort){th.tabIndex=0;th.dataset.i=i;}
      tr.appendChild(th);
    });
    thead.appendChild(tr);t.appendChild(thead);
    var tb=el('tbody');t.appendChild(tb);

    var state={i:opts.sortCol==null?-1:opts.sortCol,asc:false,q:''};

    function val(cell){
      var v=(cell&&cell.v!==undefined)?cell.v:cell;
      if(typeof v==='number')return v;
      var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));
      return isNaN(n)?String(v).toLowerCase():n;
    }
    function draw(){
      tb.innerHTML='';
      var body=rows.filter(function(r){return !r.pinned;});
      // mid-table subtotals are position-dependent: drop them once a sort is applied
      if(state.i>-1)body=body.filter(function(r){return r.cls!=='sub';});
      if(state.q){
        body=body.filter(function(r){
          return String(r.cells[0].v!==undefined?r.cells[0].v:r.cells[0]).toLowerCase().indexOf(state.q)>-1;
        });
      }
      if(state.i>-1){
        body=body.slice().sort(function(a,b){
          var x=val(a.cells[state.i]),y=val(b.cells[state.i]);
          if(typeof x==='string'||typeof y==='string')
            return state.asc?String(x).localeCompare(String(y)):String(y).localeCompare(String(x));
          return state.asc?x-y:y-x;
        });
      }
      body.concat(rows.filter(function(r){return r.pinned;})).forEach(function(r){
        var row=el('tr',r.cls||'');
        r.cells.forEach(function(cell,i){
          var txt=(cell&&cell.v!==undefined)?cell.t||cell.v:cell;
          var cls=(cell&&cell.cls)?cell.cls:(cols[i].align==='l'&&i>0?'note':'');
          row.appendChild(el('td',cls,String(txt)));
        });
        tb.appendChild(row);
      });
      Array.prototype.forEach.call(thead.querySelectorAll('th'),function(th,i){
        th.classList.toggle('sorted',i===state.i);
      });
    }
    if(opts.sort){
      Array.prototype.forEach.call(thead.querySelectorAll('th'),function(th){
        function go(){
          var i=+th.dataset.i;
          if(i===state.i){state.asc=!state.asc;}else{state.i=i;state.asc=(i===0);}
          draw();
        }
        th.addEventListener('click',go);
        th.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
      });
    }
    draw();
    t.filter=function(q){state.q=(q||'').toLowerCase();draw();};
    return t;
  }

  /* bars: rows [{label,sub,pct,value,color}] */
  function bars(rows,lw){
    var w=el('div','bars');
    rows.forEach(function(r){
      var b=el('div','bar');
      if(lw)b.style.setProperty('--lw',lw+'px');
      var inner;
      if(r.segs){
        inner=r.segs.map(function(s){
          return '<i class="bf seg" data-w="'+s.pct+'" style="background:'+s.color+';width:'+s.pct+'%" title="'+(s.t||'')+'"></i>';
        }).join('');
      }else{
        inner='<i class="bf" data-w="'+r.pct+'" style="background:'+r.color+';width:'+r.pct+'%"></i>';
      }
      b.innerHTML='<span class="bl">'+r.label+(r.sub?'<em>'+r.sub+'</em>':'')+'</span>'+
                  '<span class="bt'+(r.segs?' stack':'')+'">'+inner+'</span>'+
                  '<span class="bv">'+r.value+'</span>';
      w.appendChild(b);
    });
    return w;
  }

  function takeaway(body,src){
    var f=document.createDocumentFragment();
    f.appendChild(el('div','takeaway','<b>Key takeaway:</b> '+body));
    if(src)f.appendChild(el('p','src',src));
    return f;
  }

  function cols2(left,right,wide){
    var c=el('div','cols');
    var a=el('div','col'+(wide==='l'?' wide':'')),b=el('div','col'+(wide==='r'?' wide':''));
    left.forEach(function(n){a.appendChild(n);});
    right.forEach(function(n){b.appendChild(n);});
    c.appendChild(a);c.appendChild(b);
    return c;
  }

  function pct(n,max){return Math.max(1.5,(n/max)*100);}
  function delta(n,suffix){
    var s=(n>0?'+':'')+n+(suffix||'');
    return {v:n,t:'<span class="'+(n>0?'up':(n<0?'dn':'flat'))+'">'+s+'</span>'};
  }

  /* ------------------------------------------------ views */
  var VIEWS=[];
  var WK='Week of August 17\u201321, 2026';

  // ---- 1. Summary
  VIEWS.push({id:'summary',tab:'Summary',build:function(){
    var f=document.createDocumentFragment();
    f.appendChild(el('div','vhead','<h2>Workforce Summary: Billable</h2><p>Patient Solutions (PS) &amp; Pharmacy (Pharma) \u00b7 requisition activity for the week of August 17\u201321, 2026</p>'));
    f.appendChild(kpis([['6.9x','Starts Coverage of Departures','69 starts vs. 10 departures'],
                        ['49','Reqs Created','PS 46 \u00b7 Pharma 3'],
                        ['40','Reqs Closed','PS 28 \u00b7 Pharma 12'],
                        ['10','Terminations','PS 7 \u00b7 Pharma 3'],
                        ['65','Openings Remaining','PS 52 \u00b7 Pharma 13'],
                        ['61','Offers in Process','PS 56 \u00b7 Pharma 5']]));
    var p1=panel('Requisition Activity &amp; Upcoming Starts','Click a column heading to sort');
    p1.appendChild(table(
      [{h:'Metric',align:'l'},{h:'PS'},{h:'Pharma'},{h:'Total'},{h:'Notes',align:'l'}],
      [{cells:['Terminations','7','3','10','Departures during the week (8/17\u20138/21)']},
       {cells:['Reqs created','46','3','49','New requisitions opened']},
       {cells:['Reqs closed','28','12','40','Includes REQs 9231, 9305, and 5 Pharmacy Technician II internal promotions (9262, 9271\u20139274)']},
       {cells:['Offers in flight','56','5','61','Includes 22 internal transfer offers, CoAssist Pharmacy to Novo Obesity']},
       {cells:['Openings remaining','52','13','65','Novo Obesity reduced to 1 open role after internal transfer resolution']},
       {cells:['Upcoming starts, external','34','20','54','New hires']},
       {cells:['Upcoming starts, internal','8','7','15','Internal moves / promotions']},
       {cells:['Starts scheduled, next 30 days','42','27','69','In background / onboarding'],cls:'tot',pinned:true}],{sort:true}));
    var p2=panel('Weekly Flow at a Glance');
    p2.appendChild(bars([
      {label:'Starts Next 30 Days',pct:100,value:'69',color:C.gold},
      {label:'Openings Remaining',pct:94.2,value:'65',color:C.teal},
      {label:'Reqs Created',pct:71,value:'49',color:C.navy},
      {label:'Reqs Closed',pct:58,value:'40',color:C.green},
      {label:'Terminations',pct:14.5,value:'10',color:C.red}],150));
    p2.appendChild(el('p','pnote','69 starts are already scheduled and moving through onboarding over the next 30 days, 6.9x this week\u2019s 10 departures. Talent Acquisition\u2019s pipeline is comfortably outpacing turnover.'));
    f.appendChild(cols2([p1],[p2],'l'));
    f.appendChild(takeaway(
      'Five more Pharmacy Technician II (Escalation Specialist) roles closed this week as internal promotions (REQs 9262, 9271, 9272, 9273, 9274), all CoA-NNI, starting 8/31, plus REQs 9231 and 9305 closing earlier in the week. That brings total closures to 40. Effective 8/31, 22 employees from CoAssist Pharmacy will also transfer to Novo Obesity to fill that program\u2019s staffing gap internally. TA is covering turnover 6.9x over: 69 starts scheduled against 10 departures.',
      'Sources: Billable Report Data (Aug 21, 2026); Billable_Updates.xlsx. Reqs Closed, Offers in Flight, and Upcoming Starts updated to reflect REQs 9231, 9305, 9262, 9271, 9272, 9273, and 9274 closing this week.'));
    return f;
  }});

  // ---- 2. Pipeline coverage
  VIEWS.push({id:'coverage',tab:'Pipeline Coverage',build:function(){
    var f=document.createDocumentFragment();
    f.appendChild(el('div','vhead','<h2>Pipeline Coverage</h2><p>Open and upcoming billable demand against sourced candidate supply \u00b7 as of August 21, 2026</p>'));
    f.appendChild(kpis([['65','Openings Remaining','PS 52 \u00b7 Pharma 13'],
                        ['61','Offers in Flight','PS 56 \u00b7 Pharma 5'],
                        ['28','Upcoming (Future) Reqs','PS 26 \u00b7 Pharma 2'],
                        ['285','Candidate Pipeline','Proactive pipeline candidates'],
                        ['4.4<small> : 1</small>','Pipeline vs. Openings','285 vs. 65 open']]));
    var p1=panel('Coverage Build-Up');
    p1.appendChild(table(
      [{h:'Line Item',align:'l'},{h:'PS'},{h:'Pharma'},{h:'Total'},{h:'Basis',align:'l'}],
      [{cells:['Openings remaining (open, no offer)','52','13','65','Novo Obesity reduced to 1 open role after internal transfer']},
       {cells:['Offers in flight','56','5','61','Includes 22 internal transfer offers; 7 REQs moved to closed this week']},
       {cells:['Upcoming (future-dated) reqs','26','2','28','Not yet posted, target-fill dated']},
       {cells:['Final warnings (active)','6','2','8','Anticipated backfill']},
       {cells:['Continuous leaves (as of 8/21)','\u2014','\u2014','24','Anticipated backfill']},
       {cells:['Total anticipated demand','\u2014','\u2014','97','Openings + final warnings + leaves'],cls:'sub'},
       {cells:['Proactive pipeline candidates','\u2014','\u2014','285','Sourced and available']},
       {cells:['Pipeline vs. Openings Remaining','\u2014','\u2014','4.4 : 1','285 pipeline candidates vs. 65 open reqs'],cls:'tot',pinned:true},
       {cells:['Pipeline vs. Total Anticipated Demand','\u2014','\u2014','2.9 : 1','285 pipeline candidates vs. 97 total demand'],cls:'tot',pinned:true}]));
    var p2=panel('Open Volume by Function');
    p2.appendChild(bars([
      {label:'PS Openings',pct:100,value:'52',color:C.navy},
      {label:'Pharma Openings',pct:25,value:'13',color:C.teal}],125));
    var p3=panel('Demand vs. Supply');
    p3.appendChild(bars([
      {label:'Candidate Pipeline',pct:100,value:'285',color:C.green},
      {label:'Total Anticipated Demand',pct:34,value:'97',color:C.red},
      {label:'Offers in Flight',pct:21.4,value:'61',color:C.navy}],150));
    p3.appendChild(el('p','pnote','This week\u2019s source expands visibility into the sourcing funnel, now tracking 285 \u201cProactive Pipeline Candidates\u201d \u2014 a deeper, more proactively managed bench than last week\u2019s tracked count of 210.'));
    f.appendChild(cols2([p1],[p2,p3],'l'));
    f.appendChild(takeaway(
      'Coverage strengthens to 4.4 candidates per opening after Novo Obesity\u2019s internal transfer resolution, and even against total anticipated demand (97, including final warnings and leave backfill), the bench clears 2.9:1. PS holds 80% of open volume; Pharma\u2019s leaner base reflects its near-complete contractor conversion.',
      'Sources: Billable_Updates.xlsx (PS Open, Pharma Open); Pipeline Coverage Overview, PS/Pharma Offers in Flight, PS/Pharma Upcoming Open REQs, Final Warnings, and Continuous Leaves tabs. Openings and Offers in Flight updated to reflect the 8/31 CoAssist Pharmacy to Novo Obesity internal transfer and 7 REQs closing this week.'));
    return f;
  }});

  // ---- 3. Trend
  VIEWS.push({id:'trend',tab:'Trend & Trailing Month',build:function(){
    var f=document.createDocumentFragment();
    f.appendChild(el('div','vhead','<h2>Trend and Trailing Month View</h2><p>Three-week comparison and cumulative totals since the week of 8/3</p>'));
    f.appendChild(kpis([['165','Reqs Created, Trailing Month'],['145','Reqs Closed, Trailing Month'],
                        ['45','Terminations, Trailing Month'],['3.2x','Reqs Closed per Departure']]));
    var p1=panel('Reqs Created vs. Reqs Closed, by Week','Click a column heading to sort');
    p1.appendChild(table(
      [{h:'Week',align:'l'},{h:'Reqs Created'},{h:'Reqs Closed'},{h:'Terminations'},{h:'Closed to Terminations'}],
      [{cells:['8/3\u20138/7','49','42','27','1.6x']},
       {cells:['8/10\u20138/14','67','63','8','7.9x']},
       {cells:['8/17\u20138/21','49','40','10','4.0x']},
       {cells:['Trailing month total','165','145','45','3.2x'],cls:'tot',pinned:true}],{sort:true}));
    var p2=panel('Created vs. Closed, by Week');
    p2.appendChild(bars([

  var nav=document.getElementById('nav'), main=document.getElementById('main');
  VIEWS.forEach(function(v,i){
    var b=el('button',null,v.tab);

  function fillBars(scope){
    Array.prototype.forEach.call(scope.querySelectorAll('.bf'),function(b){
      b.style.width='0%';
      requestAnimationFrame(function(){b.style.width=b.getAttribute('data-w')+'%';});
    });
  }
  function show(id){
    Array.prototype.forEach.call(nav.querySelectorAll('button'),function(b){
      b.setAttribute('aria-selected',b.dataset.id===id?'true':'false');
    });
    Array.prototype.forEach.call(main.querySelectorAll('.view'),function(s){
      s.classList.toggle('on',s.id==='v-'+id);
    });
    var active=document.getElementById('v-'+id);
    if(active)fillBars(active);
    window.scrollTo(0,0);
  }
